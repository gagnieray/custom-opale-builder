[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # Style errors
    "F",   # Pyflakes errors
    "W",   # Warnings
    "I",   # Imports
    "UP",  # Python code modernization
    "B",   # Common mistakes
]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
